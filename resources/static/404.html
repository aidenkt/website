<!DOCTYPE html>
<html lang="en" >
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="This page doesn't exist on aidenkt.com.">
  <meta name="robots" content="noindex">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="/favicon-32.png" type="image/png" sizes="32x32">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <meta name="theme-color" content="#B5121B" />
  <title>Page Not Found — AidenKT</title>
  <link href="https://fonts.googleapis.com/css2?family=Caveat&family=Geist:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/style.css?v=7">
  <style>
    /* The home page's card, holding a message and a way home instead of the links. */
    .content-container.not-found {
      height: auto;
      padding: 34px 32px 30px;
      box-sizing: border-box;
      min-width: 300px;
    }
    .not-found #name-handwritten {
      margin-bottom: 2px;
      line-height: 1;
    }
    .not-found-message {
      margin: 0 0 22px;
      color: #FDFFFF;
      font-family: 'Geist', system-ui, -apple-system, 'Segoe UI', sans-serif;
      font-size: 17px;
      line-height: 1.45;
      text-align: center;
      text-shadow: 0 1px 12px rgba(13, 13, 13, 0.16);
      text-wrap: balance;
      max-width: 34ch;
    }
    /* Same glass pill as the Privacy link. */
    .icon-container a.home-link {
      width: auto;
      height: auto;
      color: #FDFFFF;
      -webkit-text-fill-color: currentColor;
      background: var(--pill-glass);
      font-size: 16px;
      font-weight: 500;
      line-height: 1.4;
      min-height: 44px;
      padding: 8px 22px;
      box-sizing: border-box;
      border: 1px solid rgba(253, 255, 255, 0.34);
      border-radius: 999px;
      box-shadow:
        0 10px 28px rgba(13, 13, 13, 0.12),
        0 4px 12px rgba(13, 13, 13, 0.06),
        inset 0 1px 1px rgba(253, 255, 255, 0.22),
        inset 0 -1px 1px rgba(253, 255, 255, 0.1);
      transition: transform 180ms ease, filter 180ms ease;
    }
    .icon-container a.home-link:hover {
      transform: translateY(-2px);
      filter: brightness(1.06);
    }
    @media screen and (max-width: 768px) {
      .content-container.not-found { padding: 32px 26px 28px; min-width: 260px; }
      .not-found #name-handwritten { margin-bottom: 4px; }
    }
    @media screen and (max-height: 500px) and (orientation: landscape) {
      .content-container.not-found { padding: 18px 26px 18px; }
      .not-found-message { margin-bottom: 12px; }
    }
    .icon-container a.home-link:focus-visible {
      box-shadow:
        0 0 0 6px rgba(13, 13, 13, 0.72),
        0 10px 28px rgba(13, 13, 13, 0.12),
        inset 0 1px 1px rgba(253, 255, 255, 0.22);
    }
    /* The home page's tablet rule spaces its icons from the name; here the message already does. */
    .not-found .icon-container { margin-top: 0; }
    @media (prefers-reduced-motion: reduce) {
      .icon-container a.home-link { transition: none; }
      .icon-container a.home-link:hover { transform: none; filter: none; }
    }
  </style>
  <script src="https://accounts.aidenkt.com/kit/kit.js" defer></script>
</head>
<body>
  <div class="overlay-container">
    <main class="content-container not-found">
      <h1 id="name-handwritten">404</h1>
      <p class="not-found-message">This page doesn't exist, check the link or go back home.</p>
      <div class="icon-container"><a class="home-link" href="/">aidenkt.com</a></div>
    </main>
    <a class="privacy-link" href="/privacy">Privacy</a>
    <div class="account" data-kt-account data-variant="glass" data-kt-label="Log In"></div>
  </div>
  <canvas id="canvas" aria-hidden="true"></canvas>
  <div class="blue-overlay" aria-hidden="true"></div>
  <div class="green-overlay" aria-hidden="true"></div>

  <script src='https://cdnjs.cloudflare.com/ajax/libs/three.js/110/three.min.js'></script>
  <script src='https://cdnjs.cloudflare.com/ajax/libs/chroma-js/2.0.3/chroma.min.js'></script>
  <script src="/script.js?v=3"></script>
</body>
</html>
